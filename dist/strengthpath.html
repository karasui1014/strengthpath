<meta charset="UTF-8">
<title>StrengthPath</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>
/* 探偵手帳 - スタイル
   --acc / --acc2 は JS がテーマごとに差し替える */
:root{
  --acc:#8A7358; --acc2:#D9B48F;
  --bg:#F4EFE6; --card:#FFFCF6; --soft:#FAF6EE; --line:#E4DCCC;
  --fg:#2E2A24; --dim:#8A8175; --shadow:0 2px 14px rgba(90,70,40,.07);
  --r:18px;
}
:root[data-dark="on"],
:root[data-dark="auto"]{ color-scheme:light }
@media (prefers-color-scheme:dark){
  :root[data-dark="auto"]:not([data-theme="light"]){
    --bg:#1B1A18; --card:#252320; --soft:#211F1D; --line:#38342E;
    --fg:#EDE7DC; --dim:#9A9186; --shadow:0 2px 16px rgba(0,0,0,.32); color-scheme:dark;
  }
}
:root[data-dark="on"]{
  --bg:#1B1A18; --card:#252320; --soft:#211F1D; --line:#38342E;
  --fg:#EDE7DC; --dim:#9A9186; --shadow:0 2px 16px rgba(0,0,0,.32); color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* ボタン類は連打しても文字が選択されないように（スマホでの誤爆防止） */
button,.nav-btn,.sc,.tile,.pbtn,.th,.seg,.person,summary{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);line-height:1.8;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:86px;
  transition:background .3s,color .3s}
#app{max-width:600px;margin:0 auto;padding:0 18px 30px}
img,svg{display:block;max-width:100%}
/* キャラクター画像 */
.akari{object-fit:contain}
.akari-cat{object-fit:contain}
.bmark .akari-cat{width:30px;height:30px}


/* ヘッダー */
#topbar{max-width:600px;margin:0 auto;padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;
  color:var(--fg);font-family:inherit;cursor:pointer;padding:0}
.bmark{width:34px;height:34px;border-radius:11px;background:var(--acc2);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.btxt{font-size:16px;font-weight:800;text-align:left;letter-spacing:.02em}
.btxt em{display:block;font-size:10.5px;font-weight:500;color:var(--dim);font-style:normal;letter-spacing:.06em}
.icobtn{background:var(--card);border:1px solid var(--line);color:var(--dim);
  width:44px;height:44px;border-radius:13px;font-size:17px;cursor:pointer;flex:0 0 auto}

/* 共通 */
h1{font-size:25px;line-height:1.55;font-weight:800;letter-spacing:.01em}
h2{font-size:21px;line-height:1.5;font-weight:800}
h3.sec{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.1em;
  margin:26px 0 10px;padding-left:2px}
p{margin-bottom:11px}p:last-child{margin-bottom:0}
.mini{font-size:11.5px;letter-spacing:.1em;color:var(--dim);font-weight:700;margin-bottom:7px}
.dim{color:var(--dim);font-size:14px}
.catch{color:var(--acc);font-weight:700;font-size:15.5px}
.fine{font-size:11px;color:var(--dim);line-height:1.75;margin-top:18px;padding:0 2px}

.big-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.soft{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;margin-bottom:12px}

/* ボタン */
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px 20px;
  font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer;
  transition:transform .12s,filter .12s}
.btn:active{transform:scale(.975)}
.btn:hover{filter:brightness(1.07)}
.btn.xl{width:100%;padding:18px;font-size:17px;margin-top:14px;border-radius:16px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:700}
.btn.link{background:none;color:var(--dim);border:0;font-size:13.5px;font-weight:700;
  padding:12px 6px;width:100%;text-align:center}
.btn.link:hover{color:var(--acc);filter:none}
.btn.link.wide{margin-bottom:6px}
.btn.link.danger{color:#C1685F}
.row{display:flex;gap:9px;margin-top:11px}
.row .btn{flex:1}
.row input{flex:1}

input,textarea{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;font-family:inherit;font-size:15px;margin-top:6px}
textarea{resize:vertical;line-height:1.75}
#ptext{font-size:12.5px;line-height:1.7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.fl{display:block;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:13px}

/* 燈月悠のふきだし */
.says{display:flex;align-items:flex-end;gap:10px;margin:4px 0 16px}
.says .akari{flex:0 0 auto;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;
  padding:11px 15px;font-size:14px;line-height:1.7;box-shadow:var(--shadow);position:relative}

/* ようこそ */
.welcome{text-align:center;padding:14px 4px 20px}
.welcome .akari{margin:0 auto 14px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.hi{font-size:14px;color:var(--dim);margin-bottom:18px;line-height:1.8}
.welcome h1{margin-bottom:14px}
.welcome h1 b{color:var(--acc)}
.welcome p{font-size:14.5px;color:var(--dim);text-align:left;
  background:var(--soft);border-radius:14px;padding:15px 17px}
.easy{list-style:none;margin-top:18px;text-align:left;display:grid;gap:7px}
.easy li{font-size:13px;color:var(--dim);padding-left:24px;position:relative}
.easy li::before{content:'✓';position:absolute;left:6px;color:var(--acc);font-weight:800}

/* 今日の一手 */
.stepline{font-size:22px;line-height:1.55;margin:2px 0 4px;letter-spacing:.01em}

/* タイル */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px;text-align:left;font-family:inherit;color:var(--fg);
  cursor:pointer;box-shadow:var(--shadow);display:grid;gap:1px}
.tile em{font-size:22px;font-style:normal;line-height:1.2}
.tile b{font-size:16px}
.tile span{font-size:11px;color:var(--dim)}

/* 調査 */
.quiz{padding:6px 0}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.qtext{font-size:22px;line-height:1.7;margin:8px 0 26px;min-height:96px;font-weight:800}
.scale{display:grid;gap:10px}
.sc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:16px 18px;color:var(--fg);font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;text-align:left;box-shadow:var(--shadow);
  transition:border-color .12s,transform .12s}
.sc:hover{border-color:var(--acc)}
.sc:active{transform:scale(.98)}

.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.qfoot .btn.link{width:auto}

/* てがかり */
.way h2,.style h2{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.way h2 em,.style h2 em{font-size:12px;font-weight:600;color:var(--dim);font-style:normal;
  letter-spacing:.06em;width:100%}
.wemoji{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font-size:12.5px;background:var(--soft);border:1px solid var(--line);
  border-radius:99px;padding:5px 12px;color:var(--dim);font-weight:600}
.rx{background:var(--soft);border-left:3px solid var(--acc);border-radius:10px;
  padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.8}
.rx b{display:block;font-size:12px;color:var(--acc);letter-spacing:.06em;margin-bottom:3px}

.trait{background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
.trait summary{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;
  list-style:none}
.trait summary::-webkit-details-marker{display:none}
.rk{width:23px;height:23px;flex:0 0 auto;border-radius:8px;background:var(--acc);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800}
.tname{flex:1;font-size:16.5px;font-weight:800;line-height:1.4}
.tname em{display:block;font-size:11.5px;font-weight:600;color:var(--acc);font-style:normal}
.meter{width:44px;height:5px;background:var(--line);border-radius:99px;flex:0 0 auto;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px}
.tbody{padding:0 16px 16px;font-size:14px;line-height:1.85}
.tbody .scene{font-size:12.5px;color:var(--dim)}
.tbody .lev{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}

/* 手帳 */
.steps{list-style:none;margin-top:8px}
.steps li{display:flex;align-items:flex-start;gap:8px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.7}
.steps li:last-child{border:0;padding-bottom:0}
.steps label{display:flex;align-items:flex-start;gap:11px;cursor:pointer;flex:1}
.steps input{width:21px;height:21px;flex:0 0 auto;margin:3px 0 0;accent-color:var(--acc)}
.steps li.done span{color:var(--dim);text-decoration:line-through}
.steps em{font-size:11px;color:var(--dim);font-style:normal;flex:0 0 auto;padding-top:4px}
.loglist{list-style:none}
.loglist li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.loglist li:last-child{border:0;padding-bottom:0}
.loglist .ld{font-size:11.5px;color:var(--dim);flex:0 0 40px;padding-top:3px}
.loglist .lt{flex:1;line-height:1.7}
.loglist .nx{display:block;font-size:12px;color:var(--acc);font-style:normal}

/* 相棒 */
.prompts{display:grid;gap:9px;margin-top:12px}
.pbtn{display:grid;grid-template-columns:30px 1fr;gap:2px 11px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  color:var(--fg);font-family:inherit;cursor:pointer;transition:border-color .12s}
.pbtn.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 18%,transparent)}
.pbtn em{grid-row:1/3;font-size:21px;font-style:normal;align-self:center}
.pbtn b{font-size:15.5px}
.pbtn span{font-size:12.5px;color:var(--dim);line-height:1.6}

/* 設定 */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.th{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;
  font-family:inherit;color:var(--fg);cursor:pointer;display:grid;justify-items:center;gap:3px;
  transition:border-color .12s}
.th.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 20%,transparent)}
.sw{width:30px;height:30px;border-radius:10px;margin-bottom:2px}
.th b{font-size:12.5px}
.th em{font-size:10px;color:var(--dim);font-style:normal}
.segs{display:flex;gap:7px;background:var(--soft);border:1px solid var(--line);
  border-radius:13px;padding:5px;margin-bottom:12px}
.seg{flex:1;background:none;border:0;border-radius:9px;padding:10px 4px;font-family:inherit;
  font-size:13.5px;font-weight:700;color:var(--dim);cursor:pointer}
.seg.on{background:var(--acc);color:#fff}
.quote{display:flex;align-items:center;gap:12px;text-align:left}
.quote p{font-size:14px;font-weight:700;line-height:1.7;margin:0}
.quote em{display:block;font-size:11px;color:var(--dim);font-style:normal;font-weight:500}

/* みんな */
.people{display:grid;gap:8px;margin:11px 0}
.person{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 13px;cursor:pointer}
.person.on{border-color:var(--acc)}
.pav{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--soft)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-size:15px}
.pinfo em{font-size:11.5px;color:var(--dim);font-style:normal}
.del{background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;padding:6px}

/* トースト */
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:8px 18px 8px 8px;box-shadow:0 6px 24px rgba(0,0,0,.16);
  font-size:14px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;z-index:80;
  max-width:calc(100% - 36px)}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast .akari{border-radius:50%;background:var(--soft);flex:0 0 auto}

/* シート */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,16,10,.42);display:flex;align-items:flex-end;
  justify-content:center;z-index:90;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet-wrap.in{opacity:1}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:24px 22px calc(26px + env(safe-area-inset-bottom));
  width:100%;max-width:600px;text-align:center;transform:translateY(16px);transition:transform .28s}
.sheet-wrap.in .sheet{transform:translateY(0)}
.sheet .akari{margin:0 auto 12px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.sheet-body{font-size:17px;font-weight:800;line-height:1.65}

/* ナビ */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:60}
.nav-btn{flex:1;max-width:120px;background:none;border:0;color:var(--dim);font-size:10.5px;
  font-family:inherit;font-weight:700;cursor:pointer;padding:5px 2px;display:grid;gap:2px;
  justify-items:center;border-radius:11px;transition:color .15s}
.nav-btn span{font-size:19px;line-height:1}
.nav-btn.on{color:var(--acc)}

@media(max-width:400px){
  .themes{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:20px}
  .stepline{font-size:20px}
}

/* ===== 適性チェックの結果 ===== */
.gate{text-align:center}
.gate .akari{margin:0 auto 12px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.gate .catch{margin-bottom:10px}
.gate p{text-align:left}
.tips{list-style:none;text-align:left;margin:14px 0 4px;display:grid;gap:8px}
.tips li{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;
  line-height:1.75;padding-left:38px;position:relative}
.tips li::before{content:'→';position:absolute;left:16px;color:var(--acc);font-weight:800}
.gauge{display:grid;gap:9px;margin:16px 0 4px;text-align:left}
.gauge div{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px}
.gauge span{font-size:12px;color:var(--dim);font-weight:700}
.gauge .track{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:6px;transition:width .4s}

/* ===== 副業以外の道 ===== */
.way-card h3{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:17px}
.way-card p{font-size:14px;line-height:1.85}

/* ===== しごと（副業カタログ） ===== */
.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;
  scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:99px;
  padding:8px 15px;font-size:13px;font-weight:700;font-family:inherit;color:var(--dim);cursor:pointer;
  transition:border-color .12s,color .12s}
.cat.on{border-color:var(--acc);color:var(--acc);
  background:color-mix(in srgb,var(--acc) 9%,var(--card))}

.job{background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s}
.job.hit{border-color:var(--acc)}
.job.open{border-color:var(--acc)}
.job-h{width:100%;display:grid;grid-template-columns:26px 1fr 22px;align-items:center;gap:11px;
  background:none;border:0;padding:15px 16px;font-family:inherit;color:var(--fg);
  cursor:pointer;text-align:left;position:relative}
.job .badge{position:absolute;top:0;right:0;background:var(--acc);color:#fff;font-size:10px;
  font-weight:800;padding:3px 9px;border-radius:0 0 0 10px;letter-spacing:.04em}
.job .jc{font-size:20px;line-height:1}
.job .jn{min-width:0}
.job .jn b{display:block;font-size:16px;line-height:1.45}
.job .jn em{display:block;font-size:12.5px;color:var(--dim);font-style:normal;line-height:1.65;margin-top:2px}
.job .jx{font-size:17px;color:var(--dim);text-align:center}
.job-b{padding:0 16px 16px}
.jrow{font-size:13.5px;line-height:1.8;margin-bottom:7px;padding-left:2px}
.jrow b{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.06em;
  font-weight:800;margin-bottom:1px}
.jrow.real b{color:var(--acc)}
.jrow.real{background:var(--soft);border-radius:10px;padding:11px 13px;margin-top:10px}

.jobmini{width:100%;display:grid;grid-template-columns:26px 1fr;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  margin-bottom:8px;font-family:inherit;color:var(--fg);cursor:pointer;text-align:left;
  box-shadow:var(--shadow)}
.jobmini .jc{font-size:19px;line-height:1}
.jobmini .jn b{display:block;font-size:15.5px}
.jobmini .jn em{display:block;font-size:12px;color:var(--dim);font-style:normal;line-height:1.6}
.btn.ghost.wide{width:100%;margin-bottom:6px}

/* タブが5つになったので少し詰める */
.nav-btn{font-size:10px}
.nav-btn span{font-size:18px}

/* ===== 日本語の改行を自然にする =====
   既定だと「ひとこ／とで書く」のように語の途中で折れてしまうため、
   ・line-break:strict … 句読点や閉じ括弧が行頭に来ないようにする（禁則処理）
   ・word-break:auto-phrase … 文節の切れ目で折る（Chrome系のみ。他は既定動作に戻るだけ） */
html{ line-break:strict; word-break:normal; overflow-wrap:normal }

.qtext, .stepline, .bubble, .hi, .catch, .lead,
h1, h2, h3, p, li, summary,
.tname, .tname em, .jn b, .jn em, .tile b, .tile span,
.sc, .btn, .tips li, .rx, .jrow, .pbtn span, .easy li, .fine, .note, .dim{
  word-break:auto-phrase;
}

/* 見出しは行の長さも揃える（1行目だけ長い、を防ぐ） */
.welcome h1, .gate h2, .way h2, .style h2, .stepline, .qtext{
  text-wrap:balance;
}

/* 中央寄せの短文は、折り返し幅を絞ったほうが読みやすい */
.hi{ max-width:22em; margin-left:auto; margin-right:auto }
.welcome p{ text-wrap:pretty }

/* 回答ボタン（アイコンなし） */
.sc{ justify-content:flex-start; padding:17px 20px; font-size:16.5px }

/* ごほうび（きろく画面） */
.reward{border-left:3px solid var(--acc)}
.reward b{font-size:16px}
/* 手が止まった日に、はじめた理由を添える */
.sheet-why{font-size:13px;color:var(--dim);background:var(--soft);
  border-radius:10px;padding:10px 13px;margin-top:12px;line-height:1.7}

/* こたえる前に、しごと一覧から自然に誘導するための囲み */
.nudge{border-left:3px solid var(--acc);margin-bottom:14px}
.nudge p{font-size:14px}

}

/* ガイドキャラクターの画像
   assets/akari/*.png（背景透過・256px）を表示する。
   差し替えるときは同名・同サイズのPNGを置くだけでよい。 */

const AKARI_MOODS = ['normal', 'think', 'surprised', 'idea', 'happy', 'wink'];

function akariTag(mood, size) {
  const m = AKARI_MOODS.includes(mood) ? mood : 'normal';
  const s = size || 96;
  return `<img class="akari" src="${AKARI_SRC[m]}" width="${s}" height="${s}"
    alt="" loading="lazy" decoding="async">`;
}

/* シャム猫 */
function catTag(size) {
  const s = size || 40;
  return `<img class="akari-cat" src="${AKARI_SRC.cat}" width="${s}" height="${s}"
    alt="" aria-hidden="true" loading="lazy" decoding="async">`;
}
const catSVG = catTag;   // 旧名の互換

/* 先読み（表情を切り替えたときにチラつかせない） */
function akariImgProbe() { /* 画像は埋め込み済みなので先読み不要 */ }

/* StrengthPath - アプリ本体 */
'use strict';

const KEY = 'strengthpath-v1';
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const fmtDate = d => d ? d.slice(5).replace('-', '/') : '';
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ========== ストア ========== */
let S = load();

function blankProfile(name) {
  return { id: uid(), name: name || 'あなた', createdAt: today(),
    gate: null, gateQuiz: null, quiz: null, answers: null, depth: null,
    result: null, steps: null, logs: [], sessions: [],
    goal: { why: '', reward: '', hours: '' } };
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && d.profiles) return cleanStore(d);
  } catch (e) { console.warn('保存データを読み直せなかったので、新しく始めます'); }
  const p = blankProfile('あなた');
  return { v: 1, theme: 'sepia', dark: 'auto', mode: 'self',
           activeId: p.id, selfId: p.id, profiles: { [p.id]: p } };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ===== 読み込んだデータの検証 =====
   外から来たJSONをそのまま信用すると、壊れた形のままアプリが動かなくなる。
   知っているキーだけを拾い、型と長さを揃えてから使う。 */
const LIM = { text: 2000, name: 60, list: 500 };
const str = (v, max) => (typeof v === 'string' ? v : '').slice(0, max || LIM.text);
const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v) && v >= lo && v <= hi) ? v : d;
const pick1 = (v, allowed, d) => allowed.includes(v) ? v : d;

function cleanProfile(raw) {
  const p = blankProfile(str(raw && raw.name, LIM.name) || 'あなた');
  if (!raw || typeof raw !== 'object') return p;
  if (typeof raw.id === 'string' && raw.id) p.id = raw.id.slice(0, 40);
  p.createdAt = /^\d{4}-\d{2}-\d{2}$/.test(raw.createdAt) ? raw.createdAt : today();
  p.goal = { why: str(raw.goal && raw.goal.why), reward: str(raw.goal && raw.goal.reward),
             hours: str(raw.goal && raw.goal.hours) };

  const pctMap = (o, keys) => { const r = {}; keys.forEach(k => r[k] = num(o && o[k], 0, 100, 0)); return r; };
  if (raw.result && TYPES[raw.result.type]) {
    p.result = { type: raw.result.type,
      traits: pctMap(raw.result.traits, Object.keys(TRAITS)),
      styles: pctMap(raw.result.styles, Object.keys(STYLES)),
      date: str(raw.result.date, 10) };
  }
  if (raw.gate) {
    p.gate = { motive: num(raw.gate.motive, 4, 16, 8), room: num(raw.gate.room, 4, 16, 8),
      tier: pick1(raw.gate.tier, ['ready', 'time', 'other'], 'ready'), date: str(raw.gate.date, 10) };
  }
  /* やることは、いまの定義から作り直したうえで完了状態だけ引き継ぐ。
     保存されたテキストを信じると、古い版や壊れた文言がそのまま残ってしまう。 */
  if (p.result) {
    p.steps = buildSteps(p.result.type);
    const doneTexts = new Set();
    (Array.isArray(raw.steps) ? raw.steps : []).forEach(c =>
      (c && Array.isArray(c.items) ? c.items : []).forEach(x => { if (x && x.done) doneTexts.add(str(x.text)); }));
    p.steps.forEach(c => c.items.forEach(x => { if (doneTexts.has(x.text)) { x.done = true; x.at = null; } }));
  }
  if (raw.answers && typeof raw.answers === 'object') {
    const ok = {};
    Q_PAIR.forEach((_, i) => { const v = num(raw.answers['p' + i], 1, 4, null); if (v) ok['p' + i] = v; });
    Q_STYLE_PICK.forEach((_, i) => { const v = raw.answers['y' + i]; if (STYLES[v]) ok['y' + i] = v; });
    if (Object.keys(ok).length) p.answers = ok;
  }
  p.depth = pick1(raw.depth, ['core', 'full'], p.answers ? 'core' : null);
  p.logs = (Array.isArray(raw.logs) ? raw.logs : []).slice(-LIM.list)
    .map(l => ({ date: str(l && l.date, 10), text: str(l && l.text) }))
    .filter(l => l.date && l.text);

    .filter(s => s.date && s.note);
  return p;
}

/* ========== テーマ ========== */

/* ========== 採点（4段階 → 0〜100%） =====
   答えた問題の平均で出す。必須10問だけでも、追加8問まで答えても、
   同じものさしで比べられるようにするため。 */
function avgBy(list, prefix, ans) {
  const acc = {};
  list.forEach(([c], i) => {
    const v = ans[prefix + i];
    if (typeof v === 'number') { acc[c] = acc[c] || { s: 0, n: 0 }; acc[c].s += v; acc[c].n++; }
  });
  return acc;
}
function toPct(acc, keys) {
  const r = {};
  keys.forEach(k => {
    const v = acc[k] ? acc[k].s / acc[k].n : 2.5;   // 未回答はまんなか
    r[k] = Math.round((v - 1) / 3 * 100);
  });
  return r;
}
function scoreAll(a) {
  /* どっち寄りの回答から、両側の持ち味に点をつける。
     Aを4で選べばBは1。つまり1問で2種ぶんの答えになる。 */
  const acc = {};
  Q_PAIR.forEach(([pair], i) => {
    const v = a['p' + i];
    if (typeof v !== 'number') return;
    const put = (k, val) => { acc[k] = acc[k] || { s: 0, n: 0 }; acc[k].s += val; acc[k].n++; };
    put(pair[0], v); put(pair[1], 5 - v);
  });
  const tp = toPct(acc, Object.keys(TRAITS));

  /* 進みグセは「選ばれた回数」。使うのはいちばん近い1つだけ */
  const hit = {};
  Q_STYLE_PICK.forEach((q, i) => { const c = a['y' + i]; if (c && STYLES[c]) hit[c] = (hit[c] || 0) + 1; });
  const max = Math.max(1, ...Object.values(hit));
  const sp = {};
  Object.keys(STYLES).forEach(k => { sp[k] = Math.round((hit[k] || 0) / max * 100); });

  /* 絶対値で比べると「全部そう」と答えた人が毎回同じ道になってしまうので、
     本人の平均からの差（＝その人の中での相対的な高さ）で判定する */
  const vals = Object.values(tp);
  const mean = vals.reduce((x, y) => x + y, 0) / vals.length;
  const scored = Object.keys(TYPES).map(code => {
    const w = TYPES[code].w; let s = 0, tot = 0;
    for (const k in w) { s += ((tp[k] || 0) - mean) * w[k]; tot += w[k]; }
    return { code, s: s / tot };
  }).sort((x, y) => y.s - x.s);
  /* ほぼ同点のときは、その人のいちばん高い持ち味を使う道を選ぶ */
  const top1 = Object.entries(tp).sort((x, y) => y[1] - x[1])[0][0];
  const near = scored.filter(x => scored[0].s - x.s < 0.5);
  /* ほぼ全部同じ回答だった場合は判定材料がないので、いちばん始めやすい「伝える道」にする */
  const flat = scored[0].s < 0.5;
  const best = flat ? 'content' : (near.find(x => TYPES[x.code].w[top1]) || scored[0]).code;
  return { traits: tp, styles: sp, type: best, date: today() };
}
const rank = o => Object.entries(o).sort((x, y) => y[1] - x[1]);

/* ===== 適性チェックの判定 =====
   気持ち（why + keep）と 余力（time + give）を別々に見る。
   合計点ひとつで切ると「やる気はあるが時間がない人」を弾いてしまうため。 */
function scoreGate(a) {
  const acc = avgBy(Q_GATE, 'g', a);
  const ax = k => (acc[k] ? acc[k].s / acc[k].n : 2.5) * 2;   // 各軸 2〜8
  const motive = ax('why') + ax('keep');           // 4〜16
  const room   = ax('time') + ax('give');          // 4〜16
  let tier = 'other';
  if (motive >= 11 && room >= 11) tier = 'ready';
  else if (motive >= 11) tier = 'time';
  return { motive: Math.round(motive), room: Math.round(room), tier, date: today() };
}

/* ===== 副業カタログとのマッチング =====
   持ち味の絶対値ではなく、本人の平均からの差で重みづけする */
function matchJobs(traits, n) {
  const vals = Object.values(traits);
  const mean = vals.reduce((x, y) => x + y, 0) / vals.length;
  return JOBS.map(j => {
    let s = 0, tot = 0;
    for (const k in j.w) { s += ((traits[k] || 0) - mean) * j.w[k]; tot += j.w[k]; }
    return { job: j, s: s / tot };
  }).sort((x, y) => y.s - x.s).slice(0, n || JOBS.length);
}

/* ========== やること（9つ） ========== */
function buildSteps(type) {
  const ts = TYPE_STEPS[type] || {};
  return CHAPTERS.map(ch => ({ id: ch.id,
    items: [COMMON_STEPS[ch.id], ...(ts[ch.id] || [])]
      .map(x => ({ id: uid(), text: x, done: false, at: null })) }));
}
/* 道が変わったときに、終わったやることだけ引き継いで作り直す */
function carrySteps(oldSteps, type) {
  const next = buildSteps(type);
  if (!oldSteps) return next;
  const done = new Set();
  oldSteps.forEach(c => c.items.forEach(x => { if (x.done) done.add(x.text); }));
  next.forEach(c => c.items.forEach(x => { if (done.has(x.text)) { x.done = true; x.at = today(); } }));
  return next;
}

function flat(p) {
  if (!p.steps) return [];
  const o = []; p.steps.forEach((c, i) => c.items.forEach(x => o.push({ ...x, ci: i })));
  return o;
}
const nextStep = p => flat(p).find(x => !x.done) || null;
const doneCount = p => flat(p).filter(x => x.done).length;
const totalCount = p => flat(p).length;
/* ※「連続」は休むと0に戻って気が重いので、減らない累計だけを見せる */

/* ========== しつもん ==========
   必須10問（適性3 + どっち寄り6 + 進みグセ1）で結果が出る。
   追加8問は「もっと正確にする」を選んだ人だけ。 */
const QALL = (extra) => {
  const half = Q_PAIR.length / 2;
  const pr = extra ? Q_PAIR.slice(half).map((_, i) => i + half) : Q_PAIR.map((_, i) => i).slice(0, half);
  const st = extra ? [1] : [0];
  return [
    ...pr.map(i => ({ type: 'pair', k: 'p' + i, q: Q_PAIR[i] })),
    ...st.filter(i => Q_STYLE_PICK[i]).map(i => ({ type: 'pick', k: 'y' + i, q: Q_STYLE_PICK[i] }))
  ];
};
const gateList = (extra) => (extra ? Q_GATE.slice(GATE_CORE).map((_, i) => i + GATE_CORE)
                                   : Q_GATE.map((_, i) => i).slice(0, GATE_CORE));
const CORE_COUNT = QALL(false).length + GATE_CORE;      // 10
const EXTRA_COUNT = QALL(true).length + (Q_GATE.length - GATE_CORE);  // 8

function vQuiz(p) {
  if (!p.quiz) p.quiz = { i: 0, a: {}, extra: false };
  const extra = !!p.quiz.extra;
  const qs = QALL(extra), item = qs[p.quiz.i];
  if (p.quiz.i >= qs.length) {
    p.answers = Object.assign({}, p.answers || {}, p.quiz.a);
    const before = p.result && p.result.type;
    p.result = scoreAll(p.answers);
    p.depth = extra ? 'full' : 'core';
    if (!p.steps || before !== p.result.type) p.steps = carrySteps(p.steps, p.result.type);
    p.quiz = null; save();
    setTimeout(() => go('clues'), 420);
    return `<div class="welcome">${akariTag('happy', 128)}<div class="hi">${esc(extra ? '……はっきりしました。' : VOICE.quizEnd)}</div></div>`;
  }
  /* 適性チェックのぶんを足して、通しの進み具合として見せる */
  const done = (extra ? 0 : GATE_CORE) + p.quiz.i;
  const total = extra ? EXTRA_COUNT : CORE_COUNT;
  const left = total - done;

  const body = item.type === 'pair' ? pairBody(item) : pickBody(item);
  return `<div class="quiz">
      <div class="qtop">
        <div class="bar"><i style="width:${done / total * 100}%"></i></div>
        <span class="mini">あと${left}問</span>
      </div>
      ${p.quiz.i === 0 ? say(extra ? 'もう少しだけ。同じことを、別の言い方で聞きます。' : VOICE.quizStart, 'normal', 48) : ''}
      ${body}
      <div class="qfoot">
        ${p.quiz.i > 0 ? '<button class="btn link" data-back="1">← ひとつ戻る</button>' : '<span></span>'}
        <button class="btn link" data-pause="1">今日はここまで</button>
      </div>
    </div>`;
}

function ctx(p) {
  const r = p.result, t = TYPES[r.type];
  const top = rank(r.traits).slice(0, 5).map(([c, v]) => `${TRAITS[c].name}(${v}%)`).join('、');
  const st = STYLES[rank(r.styles)[0][0]];
  const ns = nextStep(p);
  const recent = p.logs.slice(-6).map(l => `- ${l.date} ${l.text}`).join('\n') || '- まだなし';
  return `【この人のこと】
・呼び名：${p.name}
・向いてる道：${t.name}（${t.sub}）＝ ${t.catch}
・持ち味 上位5：${top}
・進みグセ：${st.name}（${st.catch}）→ ${st.tip}

・やる理由：${p.goal.why || '未記入'}
・ごほうび：${p.goal.reward || '未記入'}
・使える時間：${p.goal.hours || '未記入'}

【持ち味に近い副業（上位3つ）】
${matchJobs(r.traits, 3).map(m => '・' + m.job.name + '：' + m.job.what).join('\n')}

【いま目の前にあること】
${ns ? ns.text : '（ぜんぶ完了）'}

【最近の動き】
${recent}`;
}

function makePrompt(p, id) {
  const rule = `【あなたの役割】
あなたは、副業をはじめたい人の相談相手です。次のことを必ず守ってください。

1. 相手を絶対に否定しない。「できていない」「動けていない」「原因」といった言葉は使わない。
2. 新しいノウハウを増やさない。この人はもう十分に知っています。必要なのは、どれをやるか決めることだけです。
3. 一度に出す提案は1つだけ。しかも15分で終わるサイズまで小さくする。
4. まず質問して、相手に話させてから提案する。いきなり答えを並べない。
5. 持ち味を使うやり方で提案する。苦手なことを克服させようとしない。
6. 相手が「気が乗らない」と言ったら、責めずに、3分でできるサイズまで小さくして出し直す。
7. 落ち着いた、静かなトーンで話す。テンションを上げて煽らない。`;
  const base = `${rule}\n\n${ctx(p)}`;

  if (id === 'first') return `${base}

【今回してほしいこと】
はじめての相談です。1つずつ、私の返事を待ってから進めてください。
① 上の情報を読んで、私の持ち味がいちばん活きそうな形を1つ挙げて、それでいいか質問で確かめる
② 私の答えを聞いて、3ヶ月後にこうなっていたい姿を一文にまとめる
③ 今週やることを1つだけ、15分で終わるサイズにして提案する
④ それをやったと報告する場所を一緒に決める`;

  if (id === 'weekly') return `${base}

【今回してほしいこと】
一週間のふりかえりです。
① 最近の動きを見て、進んだところを具体的に1つ以上見つけて言葉にする
② できなかったことは責めず、「サイズが大きすぎただけ」という前提で一緒に見直す
③ 来週やることを1つ決める。先週やれなかったなら、半分の大きさにして出す
④ 最後に、来週の私に向けた短い一言を書く`;

  if (id === 'stuck') {
    const st = STYLES[rank(p.result.styles)[0][0]];
    return `${base}

【今の気分】
なんとなく気が乗りません。ちなみに私は「${st.name}（${st.catch}）」タイプだそうです。

【今回してほしいこと】
① 気が乗らないのは自然なことだと、まず一言だけ添えてください（長い励ましはいりません）
② 目の前のやることを、3分で終わるサイズまで小さくしてください
   ※調べる・考える・計画するのは無しで。「書く」「送る」「押す」など、手が動くものにしてください
③ それすら重い日のために、30秒でできる代わりの動きも1つ用意してください
④ どちらかをやったら、なんと報告すればいいか一文で書いてください`;
  }

  if (id === 'money') return `${base}

【今回してほしいこと】
はじめてお金を受け取るための準備です。
① 私の持ち味から、いちばん早く形になりそうな小さな商品を1つ提案する
② 値段は相場ではなく「私が気まずくない額」から決めたいので、質問しながら一緒に決める
③ 最初に声をかける相手を、私の身近な人から一緒に探す
④ その人に送る文面を、売り込みっぽくならない形で下書きする
⑤ いつ送るか、日付だけ決めさせる`;

  if (id === 'coach') return `あなたはコーチの補佐役です。次の相手との面談準備を手伝ってください。

${ctx(p)}

【これまでの面談】
${p.sessions.length ? p.sessions.map(s => `- ${s.date}：${s.note}${s.next ? '（次回：' + s.next + '）' : ''}`).join('\n') : '- 今回が初回'}

【作ってほしいもの】
① この人の見立てを3行で（持ち味・進みグセ・いま立っている場所）
② 今回の面談のゴール案を2つ
③ 60分の流れ（時間配分つき）
④ 最初に使う質問3つ／深掘りの質問5つ（すべて持ち味を引き出す方向で）
⑤ 最後に渡す宿題の候補を2つ（どちらも15分以内）
⑥ 話すときに気をつけたい点`;

  return base;
}

/* ========== イベント ========== */
function bind(p) {
  const on = (s, e, f) => $$(s).forEach(el => el.addEventListener(e, f));

  on('[data-nav]', 'click', e => go(e.currentTarget.dataset.nav));

  on('[data-gans]', 'click', e => {
    p.gateQuiz.a['g' + gateList(false)[p.gateQuiz.i]] = +e.currentTarget.dataset.gans;
    p.gateQuiz.i++; save(); render();
  });
  on('[data-gback]', 'click', () => { p.gateQuiz.i = Math.max(0, p.gateQuiz.i - 1); render(); });
  on('[data-jcat]', 'click', e => { jobCat = e.currentTarget.dataset.jcat; jobOpen = null; render(); });
  on('[data-job]', 'click', e => {
    const id = e.currentTarget.dataset.job;
    jobOpen = jobOpen === id ? null : id; render();
  });
  on('[data-ext]', 'click', e => window.open(e.currentTarget.dataset.ext, '_blank', 'noopener'));
  on('[data-install]', 'click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    const r = await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    if (r && r.outcome === 'accepted') toast(INSTALL.done, 'happy');
    render();
  });
  on('[data-noinstall]', 'click', () => { S.installClosed = true; render(); });

  const answerQuiz = val => {
    p.quiz.a[QALL(p.quiz.extra)[p.quiz.i].k] = val;
    p.quiz.i++; save(); render();
  };
  on('[data-pair]', 'click', e => answerQuiz(+e.currentTarget.dataset.pair));
  on('[data-style]', 'click', e => answerQuiz(e.currentTarget.dataset.style));
  on('[data-back]', 'click', () => { p.quiz.i = Math.max(0, p.quiz.i - 1); render(); });
  on('[data-pause]', 'click', () => { save(); go('home'); });
  on('[data-retake]', 'click', () => {
    if (!confirm('もう一度やってみますか？（記録はそのまま残ります）')) return;
    p.answers = null; p.depth = null; p.quiz = { i: 0, a: {}, extra: false }; go('quiz');
  });
  on('[data-deepen]', 'click', () => {
    p.answers = p.answers || {};
    p.quiz = { i: 0, a: {}, extra: true }; go('quiz');
  });
  on('[data-regate]', 'click', () => {
    if (!confirm('いまの状況を、もう一度聞きますか？')) return;
    p.gateQuiz = { i: 0, a: {} }; go('gate');
  });

  on('[data-fin]', 'click', e => {
    const id = e.currentTarget.dataset.fin;
    let txt = '';
    p.steps.forEach(c => c.items.forEach(x => {
      if (x.id === id) { x.done = true; x.at = today(); txt = x.text; }
    }));
    p.logs.push({ date: today(), text: txt });
    toast(pick(VOICE.doneStep), pick(['happy', 'wink']));
    render();
  });
  on('[data-step]', 'change', e => {
    const id = e.currentTarget.dataset.step, ck = e.currentTarget.checked;
    p.steps.forEach(c => c.items.forEach(x => {
      if (x.id === id) { x.done = ck; x.at = ck ? today() : null;
        if (ck) p.logs.push({ date: today(), text: x.text }); }
    }));
    render();
  });
  on('[data-all]', 'click', () => { showAll = !showAll; render(); });
  on('[data-again]', 'click', () => {
    if (!confirm('つぎの9つをつくりますか？')) return;
    p.steps = buildSteps(p.result.type); go('book');
  });

  on('[data-tiny]', 'click', () => {
    const st = STYLES[rank(p.result.styles)[0][0]];
    openSheet(`${st.emoji} ${st.name}のあなたへ`, st.micro,
      'これならできそう', () => {
        p.logs.push({ date: today(), text: st.micro });
        closeSheet(); toast('ちゃんと動きました。', 'wink'); render();
      }, p.goal.why);
  });

  on('[data-ai]', 'click', e => { aiSel = e.currentTarget.dataset.ai; render(); });
  on('[data-copy]', 'click', async e => {
    const ta = $('#ptext');
    try { await navigator.clipboard.writeText(ta.value); }
    catch (_) { ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly', ''); }
    e.currentTarget.textContent = '✅ コピーしました';
    setTimeout(() => { e.currentTarget.textContent = '📋 コピーする'; }, 1500);
  });
  on('[data-open]', 'click', e =>
    window.open(e.currentTarget.dataset.open === 'claude' ? 'https://claude.ai/new' : 'https://chatgpt.com/', '_blank', 'noopener'));

  on('[data-theme]', 'click', e => { S.theme = e.currentTarget.dataset.theme; render(); });
  on('[data-dark]', 'click', e => { S.dark = e.currentTarget.dataset.dark; render(); });
  on('[data-mode]', 'click', e => { S.mode = e.currentTarget.dataset.mode; render(); });

  on('[data-person]', 'click', e => { if (e.target.dataset.del) return; S.activeId = e.currentTarget.dataset.person; go('home'); });
  on('[data-del]', 'click', e => {
    e.stopPropagation(); const id = e.currentTarget.dataset.del;
    if (!confirm(`${S.profiles[id].name} のデータを消します。よろしいですか？`)) return;
    delete S.profiles[id]; if (S.activeId === id) S.activeId = S.selfId; render();
  });
  on('[data-addp]', 'click', () => {
    const n = ($('#newname').value || '').trim(); if (!n) return;
    const np = blankProfile(n); S.profiles[np.id] = np; S.activeId = np.id; go('home');
  });
  on('[data-addses]', 'click', () => {
    const note = ($('#snote').value || '').trim(); if (!note) return;
    p.sessions.push({ date: today(), note, next: ($('#snext').value || '').trim() }); render();
  });

  on('[data-savegoal]', 'click', () => {
    p.name = ($('#gname').value || 'あなた').trim();
    p.goal = { why: $('#gwhy').value, reward: $('#greward').value, hours: $('#ghours').value };
    save(); toast('しまいました。', 'happy'); render();
  });

  on('[data-export]', 'click', async e => {
    const txt = JSON.stringify(S, null, 2);
    try { await navigator.clipboard.writeText(txt); }
    catch (_) {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    e.currentTarget.textContent = 'コピーしました';
    setTimeout(() => { e.currentTarget.textContent = '書き出す'; }, 1600);
    toast('メモ帳などに貼って保存してください。', 'idea');
  });
  on('[data-import]', 'click', () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json';
    i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader();
      r.onload = () => {
        let next;
        try { next = cleanStore(JSON.parse(r.result)); }
        catch (_) { alert('このファイルは読み込めませんでした。書き出したJSONを選んでください。'); return; }
        const n = Object.keys(next.profiles).length;
        if (!confirm(`${n}人分のデータで、いまの内容を置きかえます。よろしいですか？`)) return;
        S = next; save(); go('home'); toast('読み込みました。', 'happy');
      };
      r.readAsText(f); };
    i.click();
  });
  on('[data-reset]', 'click', () => {
    if (!confirm(`${p.name}の結果と記録をぜんぶ消します。よろしいですか？`)) return;
    const f = blankProfile(p.name); f.id = p.id; S.profiles[p.id] = f; go('home');
  });
}

/* ========== トースト / シート ========== */
function toast(text, mood) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${akariTag(mood || 'happy', 40)}<span>${esc(text)}</span>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); }, 2200);
}
function openSheet(title, body, btn, fn, why) {
  const el = document.createElement('div');
  el.className = 'sheet-wrap'; el.id = 'sheet';
  el.innerHTML = `<div class="sheet">
    ${akariTag('idea', 72)}
    <div class="mini">${esc(title)}</div>
    <p class="sheet-body">${esc(body)}</p>
    ${why ? `<p class="sheet-why">はじめた理由：${esc(why)}</p>` : ''}
    <button class="btn xl" id="sheet-ok">${esc(btn)}</button>
    <button class="btn link" id="sheet-no">${esc(VOICE.skipDay)}</button>
  </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  $('#sheet-ok').onclick = fn;
  $('#sheet-no').onclick = closeSheet;
  el.onclick = e => { if (e.target === el) closeSheet(); };
}
function closeSheet() { const s = $('#sheet'); if (s) { s.classList.remove('in'); setTimeout(() => s.remove(), 250); } }

/* ========== ホーム画面に追加 ========== */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;   /* Androidなどで拾える、OS側の追加ダイアログ */

/* 追加できる状態か。すでに入れている人と、断った人には出さない */
function canInstall() {
  if (isStandalone()) return false;
  if (S.installClosed) return false;
  return !!installPrompt || isIOS();
}

function installCard() {
  if (!canInstall()) return '';
  const ios = isIOS();
  return `<div class="soft install">
    <div class="mini">📱 ${esc(INSTALL.title)}</div>
    <p>${esc(INSTALL.lead)}</p>
    ${ios
      ? `<p class="dim">${esc(INSTALL.ios.lead)}</p>
         <ol class="steps-ios">${INSTALL.ios.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
      : `<p class="dim">${esc(INSTALL.other.lead)}</p>
         <button class="btn" data-install="1">${esc(INSTALL.other.cta)}</button>`}
    <button class="btn link" data-noinstall="1">${esc(INSTALL.later)}</button>
  </div>`;
}

/* ========== 起動 ========== */
akariImgProbe();
/* Androidなどが出す「追加しますか」を、こちらのタイミングで出せるよう受け取っておく */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.dark === 'auto') applyTheme(); });
render();
/* 単体配布版では Service Worker を使わない */

</script>
